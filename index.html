<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookNest - Pencarian Buku Digital</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 35px auto;
      padding: 20px;
      background: #faf7f0;
      color: #45362d;
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      color: #75513d;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .search {
      display: flex;
      gap: 10px;
      max-width: 700px;
      margin: 20px auto;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #c7b8a6;
      border-radius: 8px;
      background: white;
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      background: #795640;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status { text-align: center; }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .book {
      display: flex;
      gap: 14px;
      padding: 16px;
      background: white;
      border: 1px solid #e6d9c9;
      border-radius: 10px;
    }

    .book img {
      width: 90px;
      height: 135px;
      object-fit: contain;
      flex-shrink: 0;
      background: #f4eee5;
    }

    .book h3 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .book p {
      font-size: 13px;
      margin: 5px 0 12px;
    }

    .book a { color: #795640; }

    @media (max-width: 500px) {
      .search { flex-direction: column; }
      .search button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>BookNest</h1>
    <h2>Pencarian Buku Digital</h2>
    <p>Temukan buku favoritmu melalui katalog Open Library.</p>
  </header>

  <form id="searchForm" class="search">
    <input id="query" type="search"
      placeholder="Masukkan judul buku atau penulis..."
      aria-label="Cari buku" required>
    <button id="searchButton" type="submit">Search</button>
  </form>

  <p id="status" aria-live="polite">
    Coba cari Harry Potter, novel, atau nama penulis.
  </p>
  <div id="results"></div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const button = document.getElementById("searchButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) return;

      button.disabled = true;
      button.textContent = "Mencari...";
      statusBox.textContent = "Sedang mencari buku...";
      resultsBox.replaceChildren();

      try {
        const url =
          "https://openlibrary.org/search.json?q=" +
          encodeURIComponent(query) +
          "&fields=key,title,author_name,cover_i,first_publish_year&limit=12";

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("API merespons dengan status " + response.status);
        }

        const data = await response.json();
        const books = data.docs || [];

        if (books.length === 0) {
          statusBox.textContent =
            'Buku "' + query + '" tidak ditemukan. Coba kata kunci lain.';
          return;
        }

        statusBox.textContent =
          "Ditemukan " + data.numFound.toLocaleString("id-ID") +
          " hasil. Menampilkan " + books.length + " buku pertama.";

        books.forEach(function(book) {
          const card = document.createElement("article");
          card.className = "book";

          const cover = document.createElement("img");
          cover.alt = "Sampul " + (book.title || "buku");
          cover.loading = "lazy";
          cover.src = book.cover_i
            ? "https://covers.openlibrary.org/b/id/" +
              book.cover_i + "-M.jpg"
            : "https://placehold.co/90x135?text=No+Cover";

          cover.onerror = function() {
            cover.onerror = null;
            cover.src = "https://placehold.co/90x135?text=No+Cover";
          };

          const details = document.createElement("div");
          const title = document.createElement("h3");
          title.textContent = book.title || "Judul tidak tersedia";

          const author = document.createElement("p");
          author.textContent =
            "Penulis: " +
            (book.author_name || ["Tidak diketahui"]).slice(0, 3).join(", ");

          const year = document.createElement("p");
          year.textContent = book.first_publish_year
            ? "Terbit pertama: " + book.first_publish_year
            : "Tahun terbit tidak tersedia";

          const link = document.createElement("a");
          link.href = "https://openlibrary.org" + (book.key || "");
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Lihat detail buku";

          details.append(title, author, year, link);
          card.append(cover, details);
          resultsBox.appendChild(card);
        });
      } catch (error) {
        statusBox.textContent =
          "Pencarian gagal terhubung ke Open Library. " +
          "Periksa koneksi internet dan coba lagi.";
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    });
  </script>
  
<section id="booknest-articles" style="max-width:900px;margin:40px auto;padding:20px;font-family:Arial,sans-serif;color:#333;">
  <h2>📚 Artikel dari BookNest</h2>
  <p>Artikel terbaru dari website WordPress BookNest.</p>
  <div id="wp-articles">Memuat artikel...</div>
  <p>
    <a href="https://integrasidotblog.wordpress.com/" target="_blank" rel="noopener">
      Kunjungi WordPress BookNest →
    </a>
  </p>
</section>

<script>
(async function () {
  const container = document.getElementById("wp-articles");
  const api = "https://public-api.wordpress.com/rest/v1.1/sites/integrasidotblog.wordpress.com/posts/?number=5";

  try {
    const response = await fetch(api);
    if (!response.ok) throw new Error("Gagal mengambil data WordPress");

    const data = await response.json();

    if (!data.posts || data.posts.length === 0) {
      container.textContent = "Belum ada artikel yang bisa ditampilkan.";
      return;
    }

    container.innerHTML = "";

    data.posts.forEach(function (post) {
      const article = document.createElement("article");
      article.style.cssText = "padding:16px;margin:14px 0;border:1px solid #ddd;border-radius:12px;";

      const title = document.createElement("h3");
      const link = document.createElement("a");
      link.href = post.URL;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = post.title;
      title.appendChild(link);

      const excerpt = document.createElement("p");
      excerpt.textContent = post.excerpt
        ? post.excerpt.replace(/<[^>]*>/g, "").trim()
        : "Baca artikel selengkapnya di WordPress BookNest.";

      article.appendChild(title);
      article.appendChild(excerpt);
      container.appendChild(article);
    });
  } catch (error) {
    container.textContent =
      "Artikel belum dapat dimuat. Silakan periksa koneksi atau API WordPress.";
    console.error(error);
  }
})();
</script>
</body>
</html>
